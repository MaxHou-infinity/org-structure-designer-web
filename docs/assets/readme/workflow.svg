<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="title desc">
  <title id="title">OrgCompass 工作流</title>
  <desc id="desc">从 Excel 和行业模板导入，到组织建模、健康诊断、方案推演与报告输出</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#312e81" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a5b4fc"/>
    </marker>
  </defs>

  <rect width="1600" height="560" rx="32" fill="url(#bg)"/>
  <text x="80" y="84" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="34" font-weight="750" fill="#111827">一次完整的组织设计闭环</text>
  <text x="80" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" fill="#64748b">不止把组织画出来，更把问题、方案和决策依据留下来</text>

  <g stroke="#a5b4fc" stroke-width="4" fill="none" marker-end="url(#arrow)">
    <path d="M332 303 H382"/>
    <path d="M624 303 H674"/>
    <path d="M916 303 H966"/>
    <path d="M1208 303 H1258"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" filter="url(#shadow)">
    <g transform="translate(72 170)">
      <rect width="260" height="266" rx="24" fill="#fff"/>
      <rect x="24" y="24" width="56" height="56" rx="16" fill="#ecfdf5"/>
      <path d="M41 38h22v28H41zM46 44h12M46 50h12M46 56h8" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round"/>
      <text x="24" y="116" font-size="15" font-weight="700" fill="#6366f1">01 · 导入</text>
      <text x="24" y="154" font-size="25" font-weight="750" fill="#111827">准备组织数据</text>
      <text x="24" y="190" font-size="17" fill="#64748b">Excel 员工表</text>
      <text x="24" y="220" font-size="17" fill="#64748b">组织结构表</text>
      <text x="24" y="250" font-size="17" fill="#64748b">内置行业模板</text>
    </g>

    <g transform="translate(364 170)">
      <rect width="260" height="266" rx="24" fill="#fff"/>
      <rect x="24" y="24" width="56" height="56" rx="16" fill="#eef2ff"/>
      <circle cx="52" cy="39" r="7" fill="#6366f1"/>
      <circle cx="40" cy="64" r="7" fill="#818cf8"/>
      <circle cx="64" cy="64" r="7" fill="#818cf8"/>
      <path d="M52 46v9M52 55H40v2M52 55h12v2" stroke="#6366f1" stroke-width="3" fill="none"/>
      <text x="24" y="116" font-size="15" font-weight="700" fill="#6366f1">02 · 建模</text>
      <text x="24" y="154" font-size="25" font-weight="750" fill="#111827">设计组织结构</text>
      <text x="24" y="190" font-size="17" fill="#64748b">拖拽部门与员工</text>
      <text x="24" y="220" font-size="17" fill="#64748b">维护负责人 / 职级</text>
      <text x="24" y="250" font-size="17" fill="#64748b">记录编制与成本</text>
    </g>

    <g transform="translate(656 170)">
      <rect width="260" height="266" rx="24" fill="#fff"/>
      <rect x="24" y="24" width="56" height="56" rx="16" fill="#fff7ed"/>
      <path d="M38 65V53M51 65V41M64 65V48" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>
      <circle cx="69" cy="36" r="6" fill="#ef4444"/>
      <text x="24" y="116" font-size="15" font-weight="700" fill="#6366f1">03 · 诊断</text>
      <text x="24" y="154" font-size="25" font-weight="750" fill="#111827">识别组织问题</text>
      <text x="24" y="190" font-size="17" fill="#64748b">管理幅度 / 层级</text>
      <text x="24" y="220" font-size="17" fill="#64748b">空岗 / 超编 / 成本</text>
      <text x="24" y="250" font-size="17" fill="#64748b">规则化优化建议</text>
    </g>

    <g transform="translate(948 170)">
      <rect width="260" height="266" rx="24" fill="#fff"/>
      <rect x="24" y="24" width="56" height="56" rx="16" fill="#f5f3ff"/>
      <path d="M39 42h28M39 63h28M46 35l-8 7 8 7M60 56l8 7-8 7" stroke="#8b5cf6" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="116" font-size="15" font-weight="700" fill="#6366f1">04 · 推演</text>
      <text x="24" y="154" font-size="25" font-weight="750" fill="#111827">比较组织方案</text>
      <text x="24" y="190" font-size="17" fill="#64748b">基线 / 方案 A / B</text>
      <text x="24" y="220" font-size="17" fill="#64748b">保留场景快照</text>
      <text x="24" y="250" font-size="17" fill="#64748b">支持撤销与复盘</text>
    </g>

    <g transform="translate(1240 170)">
      <rect width="288" height="266" rx="24" fill="#111827"/>
      <rect x="24" y="24" width="56" height="56" rx="16" fill="url(#accent)"/>
      <path d="M52 37v25M43 53l9 9 9-9M39 69h26" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="116" font-size="15" font-weight="700" fill="#c4b5fd">05 · 输出</text>
      <text x="24" y="154" font-size="25" font-weight="750" fill="#fff">交付决策材料</text>
      <text x="24" y="190" font-size="17" fill="#cbd5e1">组织图 PNG / Excel</text>
      <text x="24" y="220" font-size="17" fill="#cbd5e1">诊断报告 / PDF</text>
      <text x="24" y="250" font-size="17" fill="#cbd5e1">.orgproj 项目备份</text>
    </g>
  </g>

  <g transform="translate(80 483)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <circle cx="9" cy="-5" r="7" fill="#10b981"/>
    <text x="28" y="1" font-size="17" font-weight="650" fill="#334155">本地优先：无需服务器，组织与人员数据在设备上处理</text>
  </g>
</svg>
