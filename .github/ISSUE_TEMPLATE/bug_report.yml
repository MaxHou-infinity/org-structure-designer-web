name: Bug 报告
description: 报告可以稳定复现的功能或界面问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请勿上传真实员工数据、组织机密或未经脱敏的截图。
  - type: input
    id: version
    attributes:
      label: OrgCompass 版本
      description: 可在应用顶部或 GitHub Release 页面查看。
      placeholder: 例如 v2.0.7
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 运行环境
      options:
        - macOS Apple Silicon 桌面版
        - Windows x64 桌面版
        - Web 源码运行
        - 其他
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你原本想完成什么工作？
      placeholder: 例如：导入员工表后调整研发部门的汇报线
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出最短、可重复的操作步骤。
      placeholder: |
        1. 打开……
        2. 点击……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 实际结果与预期结果
      placeholder: 实际发生了什么？你期待发生什么？
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 脱敏后的截图或日志
      description: 请使用虚构姓名和匿名数据；不要上传真实 Excel 或 .orgproj 文件。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认本 Issue 不包含真实员工数据、薪酬、评价或组织机密。
          required: true
